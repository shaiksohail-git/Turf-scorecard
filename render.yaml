services:
  - type: web
    name: gullyscore-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gullyscore-db
          property: connectionString
      - key: GULLY_SECRET_KEY
        generateValue: true
      - key: AUTH_REQUIRED
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS
        value: "https://YOUR-FRONTEND.vercel.app"
      - key: PYTHON_VERSION
        value: "3.12.8"

databases:
  - name: gullyscore-db
    databaseName: gullyscore
    user: gullyscore
    plan: free
