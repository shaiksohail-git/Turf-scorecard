<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — GullyScore</title>
    <meta name="description" content="Sign in to your GullyScore scoring workspace." />
    <meta name="theme-color" content="#07110c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("gully-theme");
          document.documentElement.classList.toggle("dark", stored ? stored === "dark" : true);
        } catch (error) {}
      })();
    </script>
    <script src="/config.js"></script>
    <script type="module" src="/js/login.js"></script>
  </head>
  <body class="min-h-dvh bg-zinc-100 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
    <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-primary-400 focus:px-4 focus:py-3 focus:text-sm focus:font-bold focus:text-emerald-950">Skip to content</a>
    <main id="main" class="mx-auto flex min-h-dvh w-full max-w-md flex-col justify-center px-5 py-10">
      <div class="mb-8">
        <a href="/" class="flex items-center gap-2.5 text-base font-semibold tracking-tight">
          <span aria-hidden="true" class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-primary-400 text-sm font-bold text-emerald-950">GS</span>
          <span>GullyScore</span>
        </a>
        <h1 id="auth-title" class="mt-8 text-2xl font-semibold tracking-tight">Sign in to score</h1>
        <p id="auth-subtitle" class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">
          Your matches and series are private to your account.
        </p>
      </div>

      <form id="auth-form" class="space-y-4 rounded-2xl border border-zinc-200 bg-white p-5 dark:border-zinc-800 dark:bg-zinc-900" novalidate>
        <div id="register-fields" hidden>
          <label for="display-name" class="block text-sm font-medium">Display name</label>
          <input id="display-name" type="text" maxlength="60" autocomplete="name"
            class="mt-2 min-h-12 w-full rounded-xl border border-zinc-300 bg-white px-3 text-sm dark:border-zinc-700 dark:bg-zinc-950" />
        </div>
        <div>
          <label for="email" class="block text-sm font-medium">Email</label>
          <input id="email" type="email" maxlength="160" autocomplete="username" required
            class="mt-2 min-h-12 w-full rounded-xl border border-zinc-300 bg-white px-3 text-sm dark:border-zinc-700 dark:bg-zinc-950" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium">Password</label>
          <input id="password" type="password" minlength="10" maxlength="256" autocomplete="current-password" required
            class="mt-2 min-h-12 w-full rounded-xl border border-zinc-300 bg-white px-3 text-sm dark:border-zinc-700 dark:bg-zinc-950" />
          <p id="password-help" class="mt-1 text-xs text-zinc-500 dark:text-zinc-400" hidden>Use at least 10 characters.</p>
        </div>
        <div id="auth-feedback" hidden></div>
        <button id="auth-submit" type="submit"
          class="inline-flex min-h-12 w-full items-center justify-center rounded-xl bg-primary-400 px-4 text-sm font-bold text-emerald-950 hover:bg-primary-300 disabled:opacity-60">
          Sign in
        </button>
        <button id="auth-switch" type="button" class="min-h-11 w-full text-sm font-semibold text-primary-700 hover:underline dark:text-primary-300">
          Create the first account
        </button>
      </form>
      <p id="local-continue" class="mt-4 text-center text-xs text-zinc-500 dark:text-zinc-400">
        <a href="/" class="underline">Continue to local development</a>
      </p>
    </main>
  </body>
</html>
