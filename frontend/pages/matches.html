<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Match history — GullyScore</title>
    <meta name="description" content="Every GullyScore match, live and completed." />
    <meta name="theme-color" content="#07110c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("gully-theme");
          document.documentElement.classList.toggle("dark", stored ? stored === "dark" : true);
        } catch (error) {}
      })();
    </script>
    <script src="/config.js"></script>
    <script type="module" src="/js/matches.js"></script>
  </head>
  <body class="min-h-dvh bg-zinc-100 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-primary-400 focus:px-4 focus:py-3 focus:text-sm focus:font-bold focus:text-emerald-950"
      >Skip to content</a
    >
    <div id="shell"></div>

    <main id="main">
      <header class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight sm:text-3xl">Match history</h1>
          <p id="matches-subtitle" class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">
            Every match, newest first.
          </p>
        </div>
        <a
          href="/pages/match-type.html"
          class="inline-flex min-h-11 items-center justify-center rounded-xl bg-primary-400 px-4 text-sm font-bold text-emerald-950 hover:bg-primary-300"
          >New match</a
        >
      </header>

      <div id="match-filters" class="mt-5 flex flex-wrap gap-2" role="group" aria-label="Filter matches"></div>

      <div id="matches-list" class="mt-4 space-y-3" aria-busy="true">
        <p class="text-sm text-zinc-500 dark:text-zinc-400" role="status">Loading matches…</p>
      </div>
      <div id="load-more-wrap" class="mt-4 flex flex-col items-center gap-1" hidden>
        <button id="load-more" type="button"
          class="inline-flex min-h-11 items-center justify-center rounded-xl border border-zinc-300 px-5 text-sm font-semibold dark:border-zinc-700">
          Load more
        </button>
        <p id="load-more-note" class="text-xs text-zinc-500 dark:text-zinc-400"></p>
      </div>
    </main>
  </body>
</html>
