<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Series — GullyScore</title>
    <meta name="description" content="Series standings, leaderboards, fantasy points and awards." />
    <meta name="theme-color" content="#07110c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("gully-theme");
          document.documentElement.classList.toggle("dark", stored ? stored === "dark" : true);
        } catch (error) {}
      })();
    </script>
    <script src="/config.js"></script>
    <script type="module" src="/js/series.js"></script>
  </head>
  <body class="min-h-dvh bg-zinc-100 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-primary-400 focus:px-4 focus:py-3 focus:text-sm focus:font-bold focus:text-emerald-950"
      >Skip to content</a
    >
    <div id="shell"></div>
    <main id="main">
      <header>
        <a
          href="/pages/matches.html"
          class="text-sm font-semibold text-zinc-500 hover:text-primary-700 dark:text-zinc-400 dark:hover:text-primary-300"
          >← Match history</a
        >
        <h1 id="series-title" class="mt-2 text-2xl font-semibold tracking-tight sm:text-3xl">
          Series
        </h1>
        <p id="series-subtitle" class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">
          Standings, leaderboards, fantasy points and awards.
        </p>
      </header>
      <div id="series-root" class="mt-6 space-y-6" aria-busy="true">
        <p class="text-sm text-zinc-500 dark:text-zinc-400" role="status">Loading series…</p>
      </div>
    </main>
  </body>
</html>
